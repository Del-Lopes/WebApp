<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#181818" />
    <meta name="description" content="Aprofunde seus conhecimentos em negociação algorítmica." />
    <link rel="manifest" href="/manifest.json" />
    <title>Trader AFK</title>
    <link rel="icon" type="image/x-icon" href="/icon.png" />
    <script>
      // Aplica o tema salvo antes do React montar (evita piscar o tema errado).
      try {
        var t = localStorage.getItem('trader_afk_theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fafafa');
        }
      } catch (e) {}
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered: ', reg.scope))
            .catch(err => console.log('SW registration failed: ', err));
        });
      }
    </script>
</head>
  <body class="bg-page text-fg antialiased overflow-hidden">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
